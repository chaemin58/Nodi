name: PR Agent

on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  pr_agent_job:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: write
      id-token: write
    name: Run PR Agent on PR
    steps:
      - name: PR Agent action
        id: pr_agent
        uses: qodo-ai/pr-agent@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          config.model: "gemini/gemini-2.5-flash"
          config.fallback_models: '["gemini/gemini-2.5-flash"]'
          GOOGLE_AI_STUDIO.GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          github_action_config.auto_review: "true"
          PR_DESCRIPTION.extra_instructions: |
            모든 내용을 한국어로 작성해줘.
            PR Type, Description, Walkthrough 등 모든 항목을 한국어로 작성해줘.
          PR_CODE_SUGGESTIONS.extra_instructions: |
            한국어로 답변해줘.
            1. 사용되지 않는 import 제거 및 코드 최적화.
            2. Tailwind CSS 클래스 사용 시, 프로젝트에 정의되지 않은 값은 지양하고 디자인 토큰을 활용하도록 안내해줘.
            3. 코드의 논리적 오류나 성능 이슈가 있다면 구체적인 수정 방향을 제시해줘.
            4. 최대한 성능을 올릴 수 있는 방안도 제시해줘.
